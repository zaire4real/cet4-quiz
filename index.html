<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>CET4 单词抽考</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f3; --surface:#ffffff; --surface2:#eef2ee; --ink:#1a2420; --muted:#5b6b62;
    --line:#d9e0d9; --accent:#0f6b4f; --accent-ink:#ffffff; --accent-soft:#dff0e7;
    --amber:#b7791f; --amber-soft:#fdf0d3; --ok:#16794c; --ok-bg:#dcf2e4; --bad:#b42318; --bad-bg:#fde4e1;
    --radius:14px; --shadow:0 6px 24px rgba(20,40,30,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121714; --surface:#1c2420; --surface2:#232d28; --ink:#eef3ef; --muted:#a7b5ab;
      --line:#33413a; --accent:#2fae7f; --accent-ink:#0c1712; --accent-soft:#1e3a2e;
      --amber:#e0a83e; --amber-soft:#3a2f14; --ok:#4ade80; --ok-bg:#143626; --bad:#ff8a7a; --bad-bg:#3d1d19;
      --shadow:0 6px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
  button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2.75rem}
  button{font-family:inherit;cursor:pointer}
  a{color:var(--accent)}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 56px}
  .eyebrow{font-size:13px;letter-spacing:.14em;font-weight:700;color:var(--accent);text-transform:uppercase}
  h1{font-family:"Fraunces","Noto Sans SC",serif;font-size:40px;line-height:1.1;margin:6px 0 8px;font-weight:900}
  .sub{color:var(--muted);font-size:16px;margin:0 0 20px;max-width:56ch}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
  .last-result{background:var(--amber-soft);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;font-size:15px}
  .last-result strong{color:var(--amber)}
  .mode-label{font-weight:700;font-size:17px;margin:18px 0 12px}
  .mode-label:first-child{margin-top:4px}
  .modes{display:grid;gap:10px}
  @media(min-width:560px){.modes{grid-template-columns:repeat(3,1fr)}.modes.two{grid-template-columns:repeat(2,1fr)}}
  .mode-btn{text-align:left;background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:16px;min-height:96px;color:var(--ink)}
  .mode-btn .t{font-size:18px;font-weight:900;display:block;margin-bottom:4px}
  .mode-btn .d{font-size:14px;color:var(--muted);display:block;line-height:1.45}
  .mode-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:2px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;padding:9px 16px;font-size:15.5px;font-weight:700;min-height:44px}
  .chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .range-note{font-size:14px;color:var(--muted);margin-top:8px}
  .primary{width:100%;margin-top:16px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;font-size:19px;font-weight:900;padding:16px;min-height:60px}
  .primary:active{transform:scale(.99)}
  .ghost{width:100%;margin-top:10px;background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:12px;font-size:16px;font-weight:700;padding:13px;min-height:52px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-weight:700;flex-wrap:wrap}
  .score-pill{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 14px;font-size:15px}
  .progress{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-bottom:18px;border:1px solid var(--line)}
  .progress>i{display:block;height:100%;background:var(--accent);width:0%;transition:width .3s ease}
  .q-dir{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
  .q-word{font-size:38px;font-weight:900;line-height:1.2;margin:8px 0 4px;word-break:break-word}
  .q-word.zh-prompt{font-size:30px}
  .q-pos{color:var(--muted);font-size:16px}
  .q-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .speak-btn{flex:0 0 auto;width:56px;height:56px;border-radius:50%;border:2px solid var(--accent);background:var(--accent-soft);font-size:24px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent)}
  .speak-btn:disabled{opacity:.35;border-color:var(--line);background:var(--surface2);cursor:not-allowed}
  .speak-btn.small{width:44px;height:44px;font-size:19px;border-width:1.5px}
  .speak-note{font-size:13px;color:var(--muted);margin-top:2px}
  .options{display:grid;gap:10px;margin-top:18px}
  .opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:15px 16px;font-size:18px;font-weight:600;color:var(--ink);min-height:58px;width:100%}
  .opt:disabled{cursor:default;opacity:1}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--ink)}
  .opt.dim{opacity:.55}
  .feedback{margin-top:16px;border-radius:12px;padding:16px;display:none}
  .feedback.show{display:block}
  .feedback.good{background:var(--ok-bg);border:1px solid var(--ok)}
  .feedback.badf{background:var(--bad-bg);border:1px solid var(--bad)}
  .feedback .verdict{font-size:19px;font-weight:900;margin-bottom:6px}
  .feedback .detail{font-size:15.5px;line-height:1.65}
  .feedback .detail .enw{font-weight:900;font-size:18px}
  .ext-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .ext-links a{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;text-decoration:none;font-size:14.5px;font-weight:700;background:var(--surface)}
  .ext-links .locked{font-size:13.5px;color:var(--muted);align-self:center}
  .next-btn{width:100%;margin-top:16px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;font-size:18px;font-weight:900;padding:15px;min-height:56px;display:none}
  .next-btn.show{display:block}
  .end-btn{width:100%;margin-top:10px;background:transparent;color:var(--bad);border:2px solid var(--bad);border-radius:12px;font-size:16px;font-weight:700;padding:13px;min-height:52px;display:none}
  .end-btn.show{display:block}
  .quit-btn{background:none;border:none;color:var(--muted);font-size:14.5px;text-decoration:underline;min-height:44px;padding:8px 4px}
  .result-score{font-size:56px;font-weight:900;font-family:"Fraunces",serif;line-height:1;text-align:center;margin:8px 0 2px}
  .result-sub{text-align:center;color:var(--muted);margin-bottom:18px;font-size:16px}
  .wrong-item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
  .wrong-item:first-of-type{border-top:none}
  .wrong-item .wi-main{flex:1;min-width:0}
  .wrong-item .wi-en{font-weight:900;font-size:18px}
  .wrong-item .wi-zh{color:var(--muted);font-size:15px}
  .search{width:100%;font-size:17px;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);margin-bottom:14px;min-height:52px}
  .word-row{display:flex;gap:10px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
  .word-row:first-of-type{border-top:none}
  .word-row .num{color:var(--muted);font-size:13px;width:34px;flex:0 0 34px;padding-top:3px;font-variant-numeric:tabular-nums}
  .word-row .wr-main{flex:1;min-width:0}
  .word-row .wr-en{font-weight:900;font-size:18px}
  .word-row .wr-pos{color:var(--accent);font-weight:700;font-size:14px;margin-left:6px}
  .word-row .wr-zh{font-size:15.5px}
  .word-row .wr-col{font-size:13.5px;color:var(--muted);margin-top:2px}
  .word-row .wr-actions{display:flex;flex-direction:column;gap:6px;align-items:center}
  .mw-link{font-size:12.5px;font-weight:700;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 9px;min-height:32px;display:inline-flex;align-items:center}
  .hidden{display:none !important}
  .list-count{color:var(--muted);font-size:14px;margin-bottom:6px}
  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 首页 ===== -->
  <section id="view-home">
    <div class="eyebrow">CET-4 · 核心词 600</div>
    <h1>CET4 单词抽考</h1>
    <p class="sub">全部 600 个核心词，分段范围任选，两种练习方式。每题都能听英文发音，也可以连到 Merriam-Webster 和 Google 翻译对照你平常看的念法。</p>

    <div id="lastResult" class="last-result hidden"></div>

    <div class="card">
      <div class="mode-label">1 · 选择测验方向</div>
      <div class="modes" role="group" aria-label="测验方向">
        <button type="button" class="mode-btn" data-mode="en2zh" aria-pressed="true">
          <span class="t">英翻中</span>
          <span class="d">题目给英文，选出正确的中文意思</span>
        </button>
        <button type="button" class="mode-btn" data-mode="zh2en" aria-pressed="false">
          <span class="t">中翻英</span>
          <span class="d">题目给中文，选出正确的英文单词（作答前不播放发音，避免泄露答案）</span>
        </button>
        <button type="button" class="mode-btn" data-mode="mixed" aria-pressed="false">
          <span class="t">混合随机</span>
          <span class="d">每一题随机决定英翻中或中翻英</span>
        </button>
      </div>

      <div class="mode-label">2 · 选择范围</div>
      <div class="chips" role="group" aria-label="单词范围" id="homeRangeChips"></div>
      <div class="range-note" id="rangeNote"></div>

      <div class="mode-label">3 · 选择练习方式</div>
      <div class="modes two" role="group" aria-label="练习方式">
        <button type="button" class="mode-btn kind-btn" data-kind="finite" aria-pressed="true">
          <span class="t">20 题模式</span>
          <span class="d">从所选范围随机抽 20 题，做完看成绩和错题</span>
        </button>
        <button type="button" class="mode-btn kind-btn" data-kind="loop" aria-pressed="false">
          <span class="t">循环模式</span>
          <span class="d">一直出题不中断：范围内出完之前不重复，出完自动洗牌再继续，随时可结束结算</span>
        </button>
      </div>

      <button type="button" class="primary" id="startBtn">开始抽考 20 题 →</button>
      <button type="button" class="ghost" id="openListBtn">📖 查看单词表（跟随所选范围）</button>
    </div>
  </section>

  <!-- ===== 测验 ===== -->
  <section id="view-quiz" class="hidden">
    <div class="topbar">
      <span id="qProgress">第 1 / 20 题</span>
      <span class="score-pill" id="qScore">得分 0</span>
    </div>
    <div class="progress" aria-hidden="true"><i id="qBar"></i></div>

    <div class="card">
      <div class="q-head">
        <div style="flex:1;min-width:0">
          <div class="q-dir" id="qDir">英翻中 · 选出中文意思</div>
          <div class="q-word" id="qWord">—</div>
          <div class="q-pos" id="qPos"></div>
        </div>
        <div style="text-align:center">
          <button type="button" class="speak-btn" id="qSpeak" aria-label="播放英文发音">🔊</button>
          <div class="speak-note" id="qSpeakNote">听发音</div>
        </div>
      </div>

      <div class="options" id="qOptions"></div>

      <div class="feedback" id="qFeedback" aria-live="polite"></div>

      <div class="ext-links" id="qLinks"></div>

      <button type="button" class="next-btn" id="nextBtn">下一题 →</button>
      <button type="button" class="end-btn" id="endBtn">结束循环并结算</button>
    </div>
    <button type="button" class="quit-btn" id="quitBtn">放弃这次测验，回首页</button>
  </section>

  <!-- ===== 成绩 / 结算 ===== -->
  <section id="view-result" class="hidden">
    <div class="eyebrow" id="rEyebrow">测验结果</div>
    <div class="card">
      <div class="result-score" id="rScore">0 / 20</div>
      <div class="result-sub" id="rSub"></div>
      <div id="rPerfect" class="hidden" style="text-align:center;font-size:17px;font-weight:700;padding:10px 0 4px">🎉 全部答对，太厉害了！</div>
      <div id="rWrongWrap">
        <div style="font-weight:900;font-size:17px;margin:14px 0 4px">错题复习</div>
        <div id="rWrongList"></div>
      </div>
      <button type="button" class="primary" id="continueBtn">继续循环 →</button>
      <button type="button" class="primary" id="againBtn">再测一次（重新随机 20 题）</button>
      <button type="button" class="ghost" id="retryWrongBtn">只重测错题</button>
      <button type="button" class="ghost" id="homeBtn">回首页</button>
    </div>
  </section>

  <!-- ===== 单词表 ===== -->
  <section id="view-list" class="hidden">
    <div class="eyebrow">单词表</div>
    <h1 style="font-size:30px">全部单词</h1>
    <button type="button" class="ghost" id="backHomeBtn" style="margin:0 0 14px;width:auto;padding:10px 18px">← 回首页</button>
    <div class="chips" role="group" aria-label="单词表范围" id="listRangeChips" style="margin-bottom:12px"></div>
    <input class="search" id="listSearch" type="search" placeholder="搜索英文或中文，例如 affect / 影响" aria-label="搜索单词">
    <div class="card" style="padding:8px 20px">
      <div class="list-count" id="listCount"></div>
      <div id="wordList"></div>
    </div>
  </section>

</div>

function shuffle(arr){ var a = arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ---------- 发音：有道词典 → Dictionary API → Google TTS → speechSynthesis ---------- */
var audioCache = {};
var currentAudio = null;
function speakFallback(word){
  try{
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US"; u.rate = 0.92;
    var voices = window.speechSynthesis.getVoices();
    for(var i=0;i<voices.length;i++){ if(voices[i].lang && voices[i].lang.indexOf("en")===0){ u.voice = voices[i]; break; } }
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function playAudioUrl(url, word){
  return new Promise(function(resolve){
    try{
      if(currentAudio){ try{ currentAudio.pause(); }catch(e){} }
      var a = new Audio(url);
      currentAudio = a;
      var done=false;
      function ok(){ if(!done){done=true; resolve(true);} }
      function fail(){ if(!done){done=true; resolve(false);} }
      a.addEventListener("ended", ok);
      a.addEventListener("error", fail);
      var p = a.play();
      if(p && p.then){ p.then(function(){ setTimeout(ok, 350); }).catch(fail); }
      else { setTimeout(ok, 350); }
      setTimeout(function(){ if(!done && !a.paused){ ok(); } }, 2500);
    }catch(e){ resolve(false); }
  });
}
async function fetchDictAudio(word){
  if(audioCache[word] !== undefined) return audioCache[word];
  try{
    var ctrl = ("AbortController" in window) ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 4000) : null;
    var res = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word), ctrl ? {signal: ctrl.signal} : {});
    if(timer) clearTimeout(timer);
    if(!res.ok){ audioCache[word]=null; return null; }
    var data = await res.json();
    var url = null;
    if(Array.isArray(data)){
      for(var i=0;i<data.length && !url;i++){
        var ph = data[i].phonetics || [];
        for(var j=0;j<ph.length;j++){ if(ph[j].audio){ url = ph[j].audio; break; } }
      }
    }
    audioCache[word] = url;
    return url;
  }catch(e){ audioCache[word]=null; return null; }
}
async function playWord(word, btn){
  var orig = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "⏳"; }
  try{
    var ydUrl = "https://dict.youdao.com/dictvoice?audio=" + encodeURIComponent(word) + "&type=0";
    var okYd = await playAudioUrl(ydUrl, word);
    if(okYd) return;
    var dictUrl = await fetchDictAudio(word);
    if(dictUrl){
      var ok1 = await playAudioUrl(dictUrl, word);
      if(ok1) return;
    }
    var gUrl = "https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=en&client=gtx&q=" + encodeURIComponent(word);
    var ok2 = await playAudioUrl(gUrl, word);
    if(ok2) return;
    speakFallback(word);
  }catch(e){
    speakFallback(word);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = orig || "🔊"; }
  }
}

  {key:"all", label:"全部 600", lo:1, hi:600},
  {key:"r1", label:"1–100", lo:1, hi:100},
  {key:"r2", label:"101–200", lo:101, hi:200},

  {key:"r5", label:"401–500", lo:401, hi:500},
  {key:"r6", label:"501–600", lo:501, hi:600}
];
var selectedRange = "all";
var selectedMode = "en2zh";
var selectedKind = "finite"; // finite=20题模式, loop=循环模式

function curRange(){ for(var i=0;i<RANGES.length;i++){ if(RANGES[i].key===selectedRange) return RANGES[i]; } return RANGES[0]; }
function rangeWords(){ var r = curRange(); return WORDS.filter(function(w){ return w.id>=r.lo && w.id<=r.hi; }); }
function modeName(m){ return m==="en2zh" ? "英翻中" : m==="zh2en" ? "中翻英" : "混合随机"; }

function buildRangeChips(containerId){
  var box = $(containerId); box.innerHTML = "";
  RANGES.forEach(function(r){
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = r.label;
    b.setAttribute("data-range", r.key);
    b.setAttribute("aria-pressed", r.key===selectedRange ? "true" : "false");
    b.addEventListener("click", function(){ setRange(r.key); });
    box.appendChild(b);
  });
}
function syncRangeChips(){
  document.querySelectorAll(".chip[data-range]").forEach(function(c){
    c.setAttribute("aria-pressed", c.getAttribute("data-range")===selectedRange ? "true" : "false");
  });
}
function updateStartBtn(){
  $("startBtn").textContent = selectedKind==="loop" ? "开始循环练习 →" : "开始抽考 20 题 →";
  var r = curRange();
  $("rangeNote").textContent = "当前范围：" + r.label + "，共 " + rangeWords().length + " 个单词。抽题和单词表都会用这个范围。";
}
function setRange(key){
  selectedRange = key;
  syncRangeChips();
  updateStartBtn();
  if(!$("view-list").classList.contains("hidden")) renderList($("listSearch").value);
}
buildRangeChips("homeRangeChips");
buildRangeChips("listRangeChips");

document.querySelectorAll(".mode-btn[data-mode]").forEach(function(b){
  b.addEventListener("click", function(){
    selectedMode = b.getAttribute("data-mode");
    document.querySelectorAll(".mode-btn[data-mode]").forEach(function(x){ x.setAttribute("aria-pressed", x===b ? "true" : "false"); });
  });
});
document.querySelectorAll(".kind-btn").forEach(function(b){
  b.addEventListener("click", function(){
    selectedKind = b.getAttribute("data-kind");
    document.querySelectorAll(".kind-btn").forEach(function(x){ x.setAttribute("aria-pressed", x===b ? "true" : "false"); });
    updateStartBtn();
  });
});
updateStartBtn();

/* ---------- 测验状态 ---------- */
var quiz = null;
/* finite: {kind, mode, rangeKey, questions:[], idx, score, wrong:[], total}
   loop:   {kind, mode, rangeKey, deck:[], pos, round, lastId, score, answered, wrong:[], cur, curAnswered} */

function buildQuestion(w, pool){
  var dir = quiz.mode === "mixed" ? (Math.random() < 0.5 ? "en2zh" : "zh2en") : quiz.mode;
  var src = (pool && pool.length >= 4) ? pool : WORDS;
  var others = shuffle(src.filter(function(x){ return x.id !== w.id; })).slice(0,3);
  var opts = shuffle([w].concat(others));
  return { word: w, dir: dir, options: opts, correctId: w.id };
}
function startFinite(mode, customWords, rangeKey){
  var words = customWords ? shuffle(customWords.slice()) : shuffle(rangeWords()).slice(0,20);
  var pool = customWords ? rangeWords() : words.concat(rangeWords());
  quiz = { kind:"finite", mode: mode, rangeKey: rangeKey || selectedRange,
           questions: [], idx: 0, score: 0, wrong: [], total: words.length };
  var poolForQ = rangeWords();
  quiz.questions = words.map(function(w){ return buildQuestion(w, poolForQ); });
  showView("view-quiz");
  renderQuestion();
}
function startLoop(mode){
  var pool = rangeWords();
  quiz = { kind:"loop", mode: mode, rangeKey: selectedRange,
           deck: shuffle(pool), pos: 0, round: 1, lastId: null,
           score: 0, answered: 0, wrong: [], cur: null, curAnswered: false };
  nextLoopQuestion(true);
  showView("view-quiz");
  renderQuestion();
}
function nextLoopQuestion(first){
  if(quiz.pos >= quiz.deck.length){
    // 一轮出完：重新洗牌，并避免新一轮第一题和上一题重复
    var lastId = quiz.lastId;
    var nd = shuffle(rangeWords());
    if(nd.length > 1 && lastId !== null && nd[0].id === lastId){
      var t = nd[0]; nd[0] = nd[1]; nd[1] = t;
    }
    quiz.deck = nd; quiz.pos = 0; quiz.round++;
  }
  var w = quiz.deck[quiz.pos];
  quiz.cur = buildQuestion(w, rangeWords());
  quiz.curAnswered = false;
  if(!first){ /* 已由调用方 render */ }
}
function currentQuestion(){
  return quiz.kind === "loop" ? quiz.cur : quiz.questions[quiz.idx];
}
function optionText(q, optWord){
  return q.dir === "en2zh" ? optWord.zh : optWord.en;
}
function renderQuestion(){
  var q = currentQuestion();
  var isLoop = quiz.kind === "loop";
  if(isLoop){
    var pct = quiz.answered ? Math.round(quiz.score/quiz.answered*100) : 100;
    $("qProgress").textContent = "已答 " + quiz.answered + " 题 · 答对 " + quiz.score + " 题 · 本轮第 " + (quiz.pos+1) + " / " + quiz.deck.length + " 题（第 " + quiz.round + " 轮）";
    $("qScore").textContent = "正确率 " + pct + "%";
    $("qBar").style.width = ((quiz.pos)/quiz.deck.length*100) + "%";
  } else {
    $("qProgress").textContent = "第 " + (quiz.idx+1) + " / " + quiz.total + " 题";
    $("qScore").textContent = "得分 " + quiz.score;
    $("qBar").style.width = ((quiz.idx)/quiz.total*100) + "%";
  }
  $("endBtn").className = "end-btn" + (isLoop ? " show" : "");
  $("quitBtn").style.display = isLoop ? "none" : "";
  var isEn = q.dir === "en2zh";
  $("qDir").textContent = isEn ? "英翻中 · 选出中文意思" : "中翻英 · 选出英文单词";
  var wordEl = $("qWord");
  wordEl.textContent = isEn ? q.word.en : q.word.zh;
  wordEl.className = "q-word" + (isEn ? "" : " zh-prompt");
  $("qPos").textContent = isEn ? q.word.pos : "想一想：这个中文是哪个英文单词？";
  var sp = $("qSpeak");
  if(isEn){ sp.disabled = false; $("qSpeakNote").textContent = "听发音"; }
  else { sp.disabled = true; $("qSpeakNote").textContent = "答完后可听"; }
  sp.onclick = function(){ playWord(q.word.en, sp); };
  var box = $("qOptions"); box.innerHTML = "";
  q.options.forEach(function(opt){
    var b = document.createElement("button");
    b.type = "button"; b.className = "opt"; b.textContent = optionText(q, opt);
    b.setAttribute("data-id", opt.id);
    b.addEventListener("click", function(){ answer(q, opt, b); });
    box.appendChild(b);
  });
  var fb = $("qFeedback"); fb.className = "feedback"; fb.innerHTML = "";
  $("nextBtn").className = "next-btn";
  renderLinks(q, false);
}
function renderLinks(q, answered){
  var wrap = $("qLinks"); wrap.innerHTML = "";
  var isEn = q.dir === "en2zh";
  if(!isEn && !answered){
    var s = document.createElement("span"); s.className="locked";
    s.textContent = "🔒 Merriam-Webster 与 Google 翻译链接将在作答后显示（避免泄露答案）";
    wrap.appendChild(s); return;
  }
  var mw = document.createElement("a");
  mw.href = "https://www.merriam-webster.com/dictionary/" + encodeURIComponent(q.word.en);
  mw.target = "_blank"; mw.rel = "noopener";
  mw.textContent = "📖 Merriam-Webster 查询";
  var gt = document.createElement("a");
  gt.href = "https://translate.google.com/?sl=en&tl=zh-CN&text=" + encodeURIComponent(q.word.en) + "&op=translate";
  gt.target = "_blank"; gt.rel = "noopener";
  gt.textContent = "🔊 Google 翻译发音页";
  wrap.appendChild(mw); wrap.appendChild(gt);
}
function answer(q, chosen, btn){
  if(quiz.kind === "loop" && quiz.curAnswered) return;
  if(quiz.kind === "finite" && q._answered) return;
  q._answered = true;
  var correct = chosen.id === q.correctId;
  if(correct) quiz.score++;
  else quiz.wrong.push(q);
  if(quiz.kind === "loop"){
    quiz.curAnswered = true;
    quiz.answered++;
    quiz.lastId = q.word.id;
    var pct = Math.round(quiz.score/quiz.answered*100);
    $("qScore").textContent = "正确率 " + pct + "%";
    $("qProgress").textContent = "已答 " + quiz.answered + " 题 · 答对 " + quiz.score + " 题 · 本轮第 " + (quiz.pos+1) + " / " + quiz.deck.length + " 题（第 " + quiz.round + " 轮）";
    $("qBar").style.width = ((quiz.pos+1)/quiz.deck.length*100) + "%";
  } else {
    $("qScore").textContent = "得分 " + quiz.score;
    $("qBar").style.width = ((quiz.idx+1)/quiz.total*100) + "%";
  }
  var btns = $("qOptions").querySelectorAll(".opt");
  btns.forEach(function(b){
    b.disabled = true;
    var id = parseInt(b.getAttribute("data-id"),10);
    if(id === q.correctId) b.classList.add("correct");
    else if(b === btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  var sp = $("qSpeak"); sp.disabled = false; $("qSpeakNote").textContent = "听发音";
  var fb = $("qFeedback");
  fb.className = "feedback show " + (correct ? "good" : "badf");
  var correctText = q.dir === "en2zh" ? q.word.zh : q.word.en;
  var html = "";
  if(correct) html += '<div class="verdict">✅ 答对了！</div>';
  else html += '<div class="verdict">❌ 答错了，正确答案是：' + esc(correctText) + '</div>';
  html += '<div class="detail"><span class="enw">' + esc(q.word.en) + '</span> <span>' + esc(q.word.pos) + '</span> · ' + esc(q.word.zh);
  if(q.word.collocation) html += '<br>常见搭配：' + esc(q.word.collocation);
  html += '</div>';
  fb.innerHTML = html;
  renderLinks(q, true);
  var nb = $("nextBtn");
  if(quiz.kind === "loop") nb.textContent = "下一题 →";
  else nb.textContent = (quiz.idx+1 >= quiz.total) ? "看成绩 →" : "下一题 →";
  nb.className = "next-btn show";
}
$("nextBtn").addEventListener("click", function(){
  if(quiz.kind === "loop"){
    quiz.pos++;
    nextLoopQuestion(false);
    renderQuestion();
  } else {
    if(quiz.idx+1 >= quiz.total){ finishQuiz(); }
    else { quiz.idx++; renderQuestion(); }
  }
});
$("endBtn").addEventListener("click", function(){ finishQuiz(); });
$("quitBtn").addEventListener("click", function(){ quiz=null; showView("view-home"); refreshLastResult(); });
$("startBtn").addEventListener("click", function(){
  if(selectedKind === "loop") startLoop(selectedMode);
  else startFinite(selectedMode, null, selectedRange);
});

/* ---------- 成绩 / 结算 ---------- */
function saveLastResult(score, total){
  try{
    var pct = total ? Math.round(score/total*100) : 0;
    localStorage.setItem("cet4-last-result", JSON.stringify({
      score: score, total: total, pct: pct,
      mode: quiz.mode, rangeKey: quiz.rangeKey, kind: quiz.kind,
      date: new Date().toLocaleString("zh-CN"),
      wrongIds: quiz.wrong.map(function(q){ return q.word.id; })
    }));
  }catch(e){}
}
function renderWrongList(){
  var list = $("rWrongList"); list.innerHTML = "";
  quiz.wrong.forEach(function(q){
    var row = document.createElement("div"); row.className="wrong-item";
    var correctText = q.dir === "en2zh" ? q.word.zh : q.word.en;
    row.innerHTML = '<div class="wi-main"><span class="wi-en">' + esc(q.word.en) + '</span> <span style="color:var(--muted);font-size:14px">' + esc(q.word.pos) + '</span><div class="wi-zh">' + esc(q.word.zh) + ' · 正确答案：' + esc(correctText) + (q.word.collocation ? '<br>搭配：' + esc(q.word.collocation) : '') + '</div></div>';
    var b = document.createElement("button");
    b.type="button"; b.className="speak-btn small"; b.textContent="🔊"; b.setAttribute("aria-label","播放 " + q.word.en + " 发音");
    (function(w,btn){ btn.addEventListener("click", function(){ playWord(w, btn); }); })(q.word.en, b);
    row.appendChild(b);
    list.appendChild(row);
  });
}
function finishQuiz(){
  var isLoop = quiz.kind === "loop";
  var total = isLoop ? quiz.answered : quiz.total;
  var score = quiz.score;
  var pct = total ? Math.round(score/total*100) : 0;
  var rLabel = "全部 600";
  for(var i=0;i<RANGES.length;i++){ if(RANGES[i].key===quiz.rangeKey) rLabel = RANGES[i].label; }
  $("rEyebrow").textContent = isLoop ? "循环结算" : "测验结果";
  if(isLoop){
    $("rScore").textContent = total ? (pct + "%") : "—";
    $("rSub").textContent = total
      ? "范围 " + rLabel + " · 共答 " + total + " 题，答对 " + score + " 题，答错 " + (total-score) + " 题，正确率 " + pct + "%。" + (pct>=90 ? "表现优秀，继续保持！" : pct>=70 ? "不错，再复习一下错题就更稳了。" : "没关系，把错题重测几遍就会记住。")
      : "这次还没有答题就结束了。点「继续循环」随时开始。";
  } else {
    $("rScore").textContent = score + " / " + total;
    $("rSub").textContent = "范围 " + rLabel + " · 答对率 " + pct + "%" + (pct>=90 ? " · 表现优秀，继续保持！" : pct>=70 ? " · 不错，再复习一下错题就更稳了。" : pct>=50 ? " · 有进步空间，先把错题重测一遍。" : " · 没关系，用「只重测错题」多练几次就会记住。");
  }
  $("rPerfect").classList.toggle("hidden", !(total>0 && quiz.wrong.length===0));
  $("rWrongWrap").classList.toggle("hidden", quiz.wrong.length===0);
  $("retryWrongBtn").style.display = quiz.wrong.length===0 ? "none" : "";
  $("continueBtn").style.display = isLoop ? "" : "none";
  $("againBtn").style.display = isLoop ? "none" : "";
  if(total > 0) saveLastResult(score, total);
  renderWrongList();
  showView("view-result");
}
$("continueBtn").addEventListener("click", function(){
  if(!quiz || quiz.kind !== "loop") return;
  showView("view-quiz");
  if(quiz.curAnswered){ quiz.pos++; nextLoopQuestion(false); }
  renderQuestion();
});
$("againBtn").addEventListener("click", function(){
  var m = quiz ? quiz.mode : selectedMode;
  var rk = quiz ? quiz.rangeKey : selectedRange;
  startFinite(m, null, rk);
});
$("retryWrongBtn").addEventListener("click", function(){
  if(!quiz || quiz.wrong.length===0) return;
  var seen = {}, words = [];
  quiz.wrong.forEach(function(q){ if(!seen[q.word.id]){ seen[q.word.id]=1; words.push(q.word); } });
  var mode = quiz.mode, rk = quiz.rangeKey;
  startFinite(mode, words, rk);
});
$("homeBtn").addEventListener("click", function(){ showView("view-home"); refreshLastResult(); });

function refreshLastResult(){
  var el = $("lastResult");
  try{
    var raw = localStorage.getItem("cet4-last-result");
    if(!raw){ el.classList.add("hidden"); return; }
    var r = JSON.parse(raw);
    var rLabel = "全部 600";
    for(var i=0;i<RANGES.length;i++){ if(RANGES[i].key===r.rangeKey) rLabel = RANGES[i].label; }
    var kindName = r.kind === "loop" ? "循环模式" : "20 题模式";
    el.innerHTML = "📌 上次成绩（" + esc(r.date||"") + " · " + modeName(r.mode) + " · " + rLabel + " · " + kindName + "）：<strong>" + r.score + " / " + r.total + "（" + r.pct + "%）</strong>" + (r.wrongIds && r.wrongIds.length ? "，错了 " + r.wrongIds.length + " 题" : "，全对 🎉");
    el.classList.remove("hidden");
  }catch(e){ el.classList.add("hidden"); }
}

/* ---------- 单词表 ---------- */
function renderList(filter){
  var f = (filter||"").trim().toLowerCase();
  var raw = (filter||"").trim();
  var pool = rangeWords();
  var rows = pool.filter(function(w){
    if(!f) return true;
    return w.en.toLowerCase().indexOf(f) >= 0 || w.zh.indexOf(raw) >= 0 || (w.collocation||"").toLowerCase().indexOf(f) >= 0;
  });
  var r = curRange();
  $("listCount").textContent = "当前范围：" + r.label + "，共 " + pool.length + " 个单词" + (f ? "，符合搜索的 " + rows.length + " 个" : "");
  var box = $("wordList"); box.innerHTML = "";
  if(rows.length===0){ box.innerHTML = '<p style="color:var(--muted);padding:14px 0">找不到符合的单词，换个关键词试试。</p>'; return; }
  rows.forEach(function(w){
    var row = document.createElement("div"); row.className="word-row";
    var main = document.createElement("div"); main.className="wr-main";
    main.innerHTML = '<span class="wr-en">' + esc(w.en) + '</span><span class="wr-pos">' + esc(w.pos) + '</span><div class="wr-zh">' + esc(w.zh) + '</div>' + (w.collocation ? '<div class="wr-col">' + esc(w.collocation) + '</div>' : '');
    var num = document.createElement("div"); num.className="num"; num.textContent = w.id;
    var actions = document.createElement("div"); actions.className="wr-actions";
    var b = document.createElement("button");
    b.type="button"; b.className="speak-btn small"; b.textContent="🔊"; b.setAttribute("aria-label","播放 " + w.en + " 发音");
    b.addEventListener("click", function(){ playWord(w.en, b); });
    var mw = document.createElement("a");
    mw.className="mw-link"; mw.href="https://www.merriam-webster.com/dictionary/" + encodeURIComponent(w.en);
    mw.target="_blank"; mw.rel="noopener"; mw.textContent="MW ↗";
    actions.appendChild(b); actions.appendChild(mw);
    row.appendChild(num); row.appendChild(main); row.appendChild(actions);
    box.appendChild(row);
  });
}
$("listSearch").addEventListener("input", function(){ renderList(this.value); });
$("openListBtn").addEventListener("click", function(){ renderList($("listSearch").value); showView("view-list"); });
$("backHomeBtn").addEventListener("click", function(){ showView("view-home"); refreshLastResult(); });

refreshLastResult();
</script>
